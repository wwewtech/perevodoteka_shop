<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории документов — Бюро переводов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page bg-slate-50 font-sans text-slate-800 min-h-screen">
    <div id="navbar-placeholder"></div>

    <main class="app-main max-w-7xl mx-auto px-4 py-8 space-y-12">
        <section class="space-y-6">
            <div class="page-heading">
                <h1 class="page-title">Категории документов</h1>
                <p class="text-sm text-slate-500">Организуйте документы по разделам и подкатегориям.</p>
            </div>

            <div class="workspace-grid grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="panel editor-panel bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                    <h3 class="font-bold text-slate-900 text-sm" id="cat-form-title">Создать категорию</h3>
                    <form id="cat-form" onsubmit="handleCategorySubmit(event)" class="editor-form space-y-4">
                        <div>
                            <label for="cat-name-input" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Название категории (обязательно):</label>
                            <input type="text" id="cat-name-input" placeholder="Например: Паспорта" required class="block w-full text-sm px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all duration-200">
                        </div>
                        <div>
                            <label for="cat-parent-select" class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Родительская категория (необязательно):</label>
                            <select id="cat-parent-select" class="block w-full text-sm px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all duration-200">
                                <option value="">[Корневой раздел — Самый верхний уровень]</option>
                            </select>
                            <p class="text-[10px] text-slate-400 mt-1 italic">Примечание: чтобы создать категорию первого уровня, оставьте это поле пустым.</p>
                        </div>
                        <button type="submit" id="cat-submit-btn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-bold uppercase tracking-wider rounded-lg shadow-sm hover:shadow-md hover:translate-y-[-1px] active:translate-y-[0px] transition-all duration-200">Добавить в дерево</button>
                    </form>
                </div>

                <div class="panel registry-panel md:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                    <h3 class="font-bold text-slate-800 text-sm mb-4">Структура документов</h3>
                    <div id="admin-category-tree" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                        <!-- Пусто по умолчанию -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="store.js"></script>
    <script src="nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('nav-categories');
            refreshUI();
        });

        let editingCategoryId = null;
        let collapsedCategories = JSON.parse(localStorage.getItem('collapsed_categories') || '[]');

        function toggleCollapse(id) {
            const index = collapsedCategories.indexOf(id);
            if (index === -1) {
                collapsedCategories.push(id);
            } else {
                collapsedCategories.splice(index, 1);
            }
            localStorage.setItem('collapsed_categories', JSON.stringify(collapsedCategories));
            refreshUI();
        }

        function isDescendant(possibleParentId, targetId) {
            if (!possibleParentId || !targetId) return false;
            let current = store.categories.find(c => c.id === possibleParentId);
            while (current) {
                if (current.id === targetId) return true;
                current = store.categories.find(c => c.id === current.parentId);
            }
            return false;
        }

        function renderAdminCategoryTree(parentId = null, depth = 0) {
            const list = store.categories.filter(c => c.parentId === parentId);
            let html = '';
            
            list.forEach(c => {
                const indent = depth * 16;
                const hasChildren = store.categories.some(child => child.parentId === c.id);
                const isCollapsed = collapsedCategories.includes(c.id);
                const isProduct = c.isProduct === true;
                
                let toggleBtn = '';
                if (hasChildren) {
                    toggleBtn = `
                        <button aria-expanded="${!isCollapsed}" aria-label="${isCollapsed ? 'Развернуть' : 'Свернуть'} категорию ${store.escapeHtml(c.name)}" onclick="toggleCollapse('${c.id}')" class="mr-1 text-slate-500 hover:text-slate-800 focus:outline-none font-bold text-[10px] w-4 h-4 rounded hover:bg-slate-100 flex items-center justify-center">
                            ${isCollapsed ? '▶' : '▼'}
                        </button>
                    `;
                } else {
                    toggleBtn = `<span class="inline-block w-4 mr-1"></span>`;
                }

                html += `
                    <div class="registry-row flex flex-wrap items-center justify-between gap-3 py-1.5 border-b border-slate-100 hover:bg-slate-50 rounded" style="padding-left: ${indent}px">
                        <span class="font-medium text-slate-700 select-none flex items-center">
                            ${toggleBtn}
                            <span>${store.escapeHtml(c.name)}</span>
                            ${isProduct ? `<span class="ml-2 px-1.5 py-0.5 bg-emerald-100 text-emerald-800 text-[9px] font-bold rounded">Услуга</span>` : ''}
                        </span>
                        <div class="flex items-center gap-2">
                            <button onclick="startEditCategory('${c.id}')" class="text-indigo-600 hover:text-indigo-800 font-semibold px-2">Редактировать</button>
                            <button aria-label="Удалить категорию ${store.escapeHtml(c.name)}" onclick="deleteCategory('${c.id}')" class="text-rose-500 hover:text-rose-700 font-bold px-1.5">×</button>
                        </div>
                    </div>
                `;
                
                if (!isCollapsed) {
                    html += renderAdminCategoryTree(c.id, depth + 1);
                }
            });
            
            if (parentId === null) {
                document.getElementById("admin-category-tree").innerHTML = html || '<p class="empty-state text-slate-500 text-center py-8">Категорий пока нет. <a href="#cat-name-input" class="text-indigo-600 underline">Создайте первый раздел</a>, затем добавьте подкатегории документов.</p>';
            }
            return html;
        }

        function getCategoryDropdownOptions(parentId = null, depth = 0, excludeId = null) {
            const list = store.categories.filter(c => c.parentId === parentId);
            let html = '';
            list.forEach(c => {
                if (excludeId && (c.id === excludeId || isDescendant(c.id, excludeId))) {
                    return;
                }
                const prefix = '— '.repeat(depth);
                html += `<option value="${c.id}">${prefix}${store.escapeHtml(c.name)}</option>`;
                html += getCategoryDropdownOptions(c.id, depth + 1, excludeId);
            });
            return html;
        }

        function updateCategorySelectDropdown() {
            const options = getCategoryDropdownOptions(null, 0, editingCategoryId);
            document.getElementById("cat-parent-select").innerHTML = `<option value="">[Корневая категория]</option>` + options;
        }

        function startEditCategory(id) {
            const cat = store.categories.find(c => c.id === id);
            if (!cat) return;

            editingCategoryId = id;
            document.getElementById("cat-form-title").textContent = "Редактировать категорию";
            document.getElementById("cat-name-input").value = cat.name;
            
            updateCategorySelectDropdown();
            document.getElementById("cat-parent-select").value = cat.parentId || "";
            document.getElementById("cat-submit-btn").textContent = "Сохранить изменения";
        }

        function handleCategorySubmit(e) {
            e.preventDefault();
            const nameInput = document.getElementById("cat-name-input");
            const parentSelect = document.getElementById("cat-parent-select");
            const name = nameInput.value.trim();
            const parentId = parentSelect.value || null;

            if (!name) return;

            if (editingCategoryId) {
                const cat = store.categories.find(c => c.id === editingCategoryId);
                if (cat) {
                    cat.name = name;
                    cat.parentId = parentId;
                    store.saveCategories();

                    // Каскадный пересчет путей для синхронной фильтрации на витрине
                    store.products.forEach(p => {
                        p.categoryPathIds = store.getCategoryPathIds(p.categoryId);
                    });
                    store.saveProducts();
                }
                editingCategoryId = null;
                document.getElementById("cat-form-title").textContent = "Создать категорию";
                document.getElementById("cat-submit-btn").textContent = "Добавить в дерево";
            } else {
                store.categories.push({ id: store.generateUniqueId("cat"), name, parentId });
                store.saveCategories();
            }

            nameInput.value = '';
            parentSelect.value = '';
            refreshUI();
        }

        function deleteCategory(id) {
            if (store.categories.some(c => c.parentId === id)) {
                alert("Ошибка удаления: Данная категория содержит вложенные подкатегории.");
                return;
            }
            if (store.products.some(p => p.categoryId === id)) {
                alert("Ошибка удаления: К этой категории привязаны товары.");
                return;
            }

            if (editingCategoryId === id) {
                editingCategoryId = null;
                document.getElementById("cat-form-title").textContent = "Создать категорию";
                document.getElementById("cat-name-input").value = "";
                document.getElementById("cat-parent-select").value = "";
                document.getElementById("cat-submit-btn").textContent = "Добавить в дерево";
            }

            store.categories = store.categories.filter(c => c.id !== id);
            store.saveCategories();
            refreshUI();
        }

        function refreshUI() {
            renderAdminCategoryTree();
            updateCategorySelectDropdown();
        }
    </script>
</body>
</html>
