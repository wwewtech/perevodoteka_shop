<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Языки — Бюро переводов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page bg-slate-50 font-sans text-slate-800 min-h-screen">
    <div id="navbar-placeholder"></div>

    <main class="app-main max-w-7xl mx-auto px-4 py-8 space-y-12">
        <section class="space-y-6">
            <div class="page-heading">
                <h1 class="page-title">Языки</h1>
                <p class="text-sm text-slate-500">Ведите реестр языков для шаблонов и услуг перевода.</p>
            </div>

            <div class="workspace-grid grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="panel editor-panel bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm" id="form-title">Добавить новый язык</h3>
                    <form id="lang-form" onsubmit="handleAddLanguage(event)" class="editor-form space-y-3">
                        <div>
                            <label for="lang-name-input" class="block text-[10px] font-bold text-slate-500 mb-1">Название языка (обязательно):</label>
                            <input type="text" id="lang-name-input" placeholder="Например: Русский" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="lang-code-input" class="block text-[10px] font-bold text-slate-500 mb-1">Двухбуквенный код ISO (обязательно):</label>
                            <input type="text" id="lang-code-input" placeholder="Например: ru" required maxlength="2" class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded focus:outline-none focus:border-indigo-500 uppercase">
                        </div>
                        <button type="submit" id="lang-submit-btn" class="w-full py-2 bg-indigo-600 text-white rounded text-xs font-semibold hover:bg-indigo-700 transition">Внести в реестр</button>
                    </form>
                </div>

                <div class="panel registry-panel md:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                    <h3 class="font-bold text-slate-800 text-sm mb-4">Реестр доступных языков</h3>
                    <div id="languages-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                        <!-- Список -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="store.js"></script>
    <script src="nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('nav-languages');
            refreshUI();
        });

        let editingLangId = null;

        function renderLanguagesList() {
            const listContainer = document.getElementById("languages-list");
            let html = '';
            store.languages.forEach(lang => {
                html += `
                    <div class="registry-row flex flex-wrap items-center justify-between gap-3 py-1.5 border-b border-slate-100 hover:bg-slate-50 rounded px-2">
                        <span class="font-medium text-slate-700">
                            ${store.escapeHtml(lang.name)} <span class="text-slate-400 text-[10px]">(${store.escapeHtml(lang.code.toUpperCase())})</span>
                        </span>
                        <div class="flex items-center gap-2">
                            <button onclick="startEditLanguage('${lang.id}')" class="text-indigo-600 hover:text-indigo-800 font-semibold px-2">Редактировать</button>
                            <button aria-label="Удалить язык ${store.escapeHtml(lang.name)}" onclick="deleteLanguage('${lang.id}')" class="text-rose-500 hover:text-rose-700 font-bold px-1.5">×</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html || '<p class="empty-state text-slate-500 text-center py-8">Языков пока нет. <a href="#lang-name-input" class="text-indigo-600 underline">Добавьте первый язык</a>, чтобы использовать его в шаблонах и услугах.</p>';
        }

        function startEditLanguage(id) {
            const lang = store.languages.find(l => l.id === id);
            if (!lang) return;

            editingLangId = id;
            document.getElementById("form-title").textContent = "Редактировать язык";
            document.getElementById("lang-name-input").value = lang.name;
            document.getElementById("lang-code-input").value = lang.code;
            document.getElementById("lang-submit-btn").textContent = "Сохранить изменения";
        }

        function handleAddLanguage(e) {
            e.preventDefault();
            const nameInput = document.getElementById("lang-name-input");
            const codeInput = document.getElementById("lang-code-input");
            const name = nameInput.value.trim();
            const code = codeInput.value.trim().toLowerCase();

            if (!name || !code) return;

            if (editingLangId) {
                // Исключаем текущий редактируемый язык при проверке дублей
                if (store.languages.some(l => l.code === code && l.id !== editingLangId)) {
                    alert(`Язык с кодом "${code.toUpperCase()}" уже внесен в реестр.`);
                    return;
                }
                const lang = store.languages.find(l => l.id === editingLangId);
                if (lang) {
                    lang.name = name;
                    lang.code = code;
                    store.saveLanguages();
                }
                editingLangId = null;
                document.getElementById("form-title").textContent = "Добавить новый язык";
                document.getElementById("lang-submit-btn").textContent = "Внести в реестр";
            } else {
                if (store.languages.some(l => l.code === code)) {
                    alert(`Язык с кодом "${code.toUpperCase()}" уже внесен в реестр.`);
                    return;
                }
                store.languages.push({ id: store.generateUniqueId("lang"), name, code });
                store.saveLanguages();
            }

            nameInput.value = '';
            codeInput.value = '';
            refreshUI();
        }

        function deleteLanguage(id) {
            const langCode = store.languages.find(l => l.id === id)?.code;
            if (!langCode) return;

            const isUsed = store.templates.some(t => t.sourceLang === langCode || t.targetLang === langCode) ||
                           store.products.some(p => p.sourceLang === langCode || p.targetLang === langCode);

            if (isUsed) {
                alert("Ошибка удаления: Данный язык используется в схемах шаблонов или выпущенных товарах.");
                return;
            }

            if (editingLangId === id) {
                editingLangId = null;
                document.getElementById("form-title").textContent = "Добавить новый язык";
                document.getElementById("lang-name-input").value = "";
                document.getElementById("lang-code-input").value = "";
                document.getElementById("lang-submit-btn").textContent = "Внести в реестр";
            }

            store.languages = store.languages.filter(l => l.id !== id);
            store.saveLanguages();
            refreshUI();
        }

        function refreshUI() {
            renderLanguagesList();
        }
    </script>
</body>
</html>
